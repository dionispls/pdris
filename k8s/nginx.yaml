apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodgram-nginx
  namespace: default
  labels:
    app: foodgram-nginx
spec:
  selector:
    matchLabels:
      app: foodgram-nginx
  template:
    metadata:
      labels:
        app: foodgram-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4-alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
#        - name: frontend-build
#          mountPath: /usr/share/nginx/html
#        - name: static-files
#          mountPath: /etc/nginx/html/static
#        - name: media-files
#          mountPath: /etc/nginx/html/media
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: frontend-build
        persistentVolumeClaim:
          claimName: static-data
      - name: static-files
        persistentVolumeClaim:
          claimName: static-data
      - name: media-files
        persistentVolumeClaim:
          claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: foodgram-nginx
  namespace: default
  labels:
    app: foodgram-nginx
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: foodgram-nginx
