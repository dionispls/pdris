apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: foodgram
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-data
  namespace: foodgram
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: foodgram
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
