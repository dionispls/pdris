---
- name: Create foodgram directory
  file:
    path: "{{ ansible_env.HOME }}/foodgram"
    state: directory
    mode: '0755'

- name: Copy docker-compose.yml template
  template:
    src: docker-compose.yml.j2
    dest: "{{ ansible_env.HOME }}/foodgram/docker-compose.yml"
    mode: '0644'

- name: Copy nginx.conf
  copy:
    src: "{{ playbook_dir }}/roles/nginx/files/nginx.conf"
    dest: "{{ ansible_env.HOME }}/foodgram/nginx.conf"
    mode: '0644'

- name: Copy .env file if exists
  copy:
    src: "{{ playbook_dir }}/../.env"
    dest: "{{ ansible_env.HOME }}/foodgram/.env"
    mode: '0644'
  ignore_errors: yes

- name: Copy deploy script
  template:
    src: deploy.sh.j2
    dest: "{{ ansible_env.HOME }}/foodgram/deploy.sh"
    mode: '0755'

- name: Run deploy script
  shell: "{{ ansible_env.HOME }}/foodgram/deploy.sh"
  args:
    chdir: "{{ ansible_env.HOME }}/foodgram"
  environment:
    DOCKER_HOST: "unix:///var/run/docker.sock"
